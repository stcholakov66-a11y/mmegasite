<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded app icon container -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Invoice Sheet with folded top-right corner -->
  <g filter="url(#dropShadow)">
    <path d="M 18 13
             L 37 13
             L 46 22
             L 46 51
             C 46 52.5 44.5 53 43 53
             L 21 53
             C 19.5 53 18 52.5 18 51
             Z" 
          fill="#ffffff" />
    <!-- Folded corner flap -->
    <path d="M 37 13
             L 37 22
             L 46 22
             Z" 
          fill="#cbd5e1" />
  </g>

  <!-- Stylized Euro / Invoice badge in header -->
  <circle cx="26" cy="23" r="4.5" fill="#2563eb" />
  <path d="M 27.5 21
           C 25 20.5 24 22 24 23
           C 24 24 25 25.5 27.5 25" 
        stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <line x1="23.2" y1="22.5" x2="26" y2="22.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
  <line x1="23.2" y1="23.5" x2="26" y2="23.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

  <!-- Invoice text lines -->
  <rect x="23" y="31" width="18" height="2.5" rx="1.2" fill="#2563eb" />
  <rect x="23" y="36.5" width="18" height="2.2" rx="1.1" fill="#94a3b8" />
  <rect x="23" y="41.5" width="13" height="2.2" rx="1.1" fill="#cbd5e1" />

  <!-- Small success total pill -->
  <rect x="23" y="46.5" width="18" height="2.5" rx="1.2" fill="#10b981" />
</svg>
